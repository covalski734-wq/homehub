name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:check
